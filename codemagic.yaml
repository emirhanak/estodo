workflows:
  ios-testflight:
    name: estodo iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: estodo-app-store

    environment:
      groups:
        # Add this group in Codemagic and mark both values as Secret:
        # - FIREBASE_DART_DEFINES_B64
        # - IOS_FIREBASE_SECRET
        - estodo_firebase
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.estodo.app
      flutter: stable
      xcode: 26.4
      cocoapods: default

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Restore private Firebase configuration
        script: |
          set -e
          mkdir -p config ios/Runner
          echo "$FIREBASE_DART_DEFINES_B64" | base64 --decode > config/firebase.prod.json
          printf '%s' "$IOS_FIREBASE_SECRET" > ios/Runner/GoogleService-Info.plist

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Test
        script: flutter test

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Apply App Store signing
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define-from-file=config/firebase.prod.json

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
