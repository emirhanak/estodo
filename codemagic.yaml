definitions:
  env_versions: &env_versions
    flutter: stable
    xcode: latest
    cocoapods: default

workflows:
  ios-testflight:
    name: estodo iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: estodo-app-store

    environment:
      groups:
        # Add this group in Codemagic and mark both values as Secret:
        # - FIREBASE_DART_DEFINES_B64
        # - IOS_FIREBASE_SECRET
        - estodo_firebase
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.estodo.app
      <<: *env_versions

    triggering:
      events:
        - tag
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Restore private Firebase configuration
        script: |
          set -e
          mkdir -p config ios/Runner
          echo "$FIREBASE_DART_DEFINES_B64" | base64 --decode > config/firebase.prod.json
          printf '%s' "$IOS_FIREBASE_SECRET" > ios/Runner/GoogleService-Info.plist

      - name: Install Flutter dependencies
        script: |
          flutter pub get
          flutter gen-l10n

      - name: Analyze
        script: flutter analyze

      - name: Test
        script: flutter test

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Apply App Store signing
        script: xcode-project use-profiles

      # The next build number comes from App Store Connect if available, or defaults safely.
      - name: Resolve the next build number
        script: |
          set -e
          if [ -z "$APP_STORE_APP_ID" ]; then
            echo "APP_STORE_APP_ID is not set in environment group. Defaulting BUILD_NUMBER to 1."
            echo "BUILD_NUMBER=1" >> $CM_ENV
          else
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "0")
            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
              LATEST=0
            fi
            echo "BUILD_NUMBER=$((LATEST + 1))" >> $CM_ENV
          fi

      - name: Build signed IPA
        script: |
          set -e
          BUILD_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define-from-file=config/firebase.prod.json

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # TestFlight only. App Store submission stays manual.
        submit_to_testflight: true
        submit_to_app_store: false
        # Internal testers get the build with no beta review. Uncomment and use
        # the exact group name from App Store Connect to reach external testers
        # (that path does go through Apple's beta review).
        # beta_groups:
        #   - External testers
      email:
        recipients:
          - flashemirhan@gmail.com
        notify:
          success: true
          failure: true
