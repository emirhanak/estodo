name: estodo
description: A production-ready Microsoft To Do inspired task manager built with Flutter, Riverpod, Hive, and Firebase.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: ^6.3.0
  connectivity_plus: ^7.1.1
  cupertino_icons: ^1.0.9
  equatable: ^2.0.8
  firebase_analytics: ^12.3.0
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.2.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.0.10
  flutter_timezone: ^5.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: any
  package_info_plus: ^10.1.0
  shared_preferences: ^2.3.3
  timezone: ^0.11.0
  uuid: ^4.5.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#F7FAFC"
  adaptive_icon_foreground: assets/branding/app_icon.png
  min_sdk_android: 23

flutter_native_splash:
  color: "#F7FAFC"
  color_dark: "#111827"
  image: assets/branding/splash.png
  image_dark: assets/branding/splash.png
  android_12:
    color: "#F7FAFC"
    color_dark: "#111827"
    image: assets/branding/splash.png
    image_dark: assets/branding/splash.png
